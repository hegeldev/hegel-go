profile: coverage.out

threshold:
  file: 100
  package: 0
  total: 0

exclude:
  paths:
    # Generated by stringer (DO NOT EDIT); String() arms aren't all exercised.
    - _string\.go$
    # Vendored Go runtime handle implementation, maintained upstream.
    - internal/cgo/handle\.go$
    # Standalone SQL workload, checked against a live database.
    - examples/bank/main\.go$
    - examples/ring/main\.go$
