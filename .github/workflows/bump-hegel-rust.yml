name: Bump hegel-rust

on:
  # Fired by hegel-rust's release workflow; client_payload.version carries the
  # released version so we pin that exact release rather than racing on latest.
  repository_dispatch:
    types: [hegel-rust-release]
  # Manual escape hatch: run with an empty version to pin the latest release,
  # or supply a specific version.
  workflow_dispatch:
    inputs:
      version:
        description: "hegel-rust version to pin (empty = latest release)"
        required: false
        default: ""

permissions: {}

jobs:
  bump:
    name: bump hegel-rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel-go

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }} # zizmor: ignore[artipacked]
          lfs: true  # vendored libhegel binaries are stored via git-lfs

      - name: Initialize git-lfs
        run: git lfs install

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Bump pinned libhegel
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEGEL_RELEASE_APP_ID: ${{ vars.HEGEL_RELEASE_APP_ID }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: python .github/scripts/bump_hegel_rust.py "$VERSION"

      # The version bump changes the pinned constant and vendored binaries. The C ABI
      # may have shifted with the new release, so realign the FFI wrapper
      # (internal/libhegel) using the align-libhegel skill before the PR is
      # reviewed. Skipped when nothing was bumped.
      - name: Align the FFI wrapper to the new libhegel
        if: steps.bump.outputs.bumped == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4d7e1f0cd85743fdc93b1c8040ab54395da024e2 # v1.0.149
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          # hegel-rust fires this workflow via repository_dispatch using the
          # hegel-release[bot] app token, so the actor is a bot. The action
          # blocks bot-initiated runs by default; allow this specific bot.
          allowed_bots: hegel-release
          prompt: |
            The pinned libhegel version was just bumped to v${{ steps.bump.outputs.version }}
            (internal/libhegel/version.go and internal/libhegel/libs/) on this checkout. Use the align-libhegel skill
            to align the Go FFI wrapper in internal/libhegel/ to the new release, so that
            `just check vendored` passes. Do NOT change the public `hegel` package API — only
            the internal binding layer. Do NOT commit or push; leave all changes in the
            working tree for the next step to commit.
          claude_args: >-
            --allowed-tools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,Skill"
            --max-turns 60

      # Fold the FFI alignment into the bump commit so the branch carries a
      # single bump+fix commit. No-op when alignment changed nothing.
      - name: Amend the FFI alignment into the bump commit
        if: steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No FFI alignment changes to amend."
            exit 0
          fi
          git add -A
          git commit --amend --no-edit

      # The single push: force-push the per-version branch and open/update the
      # PR. The branch name embeds the pinned version, so the force-push only
      # ever overwrites a re-run of this same version — never another
      # version's (or a human's) work.
      - name: Push and open/update the PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          # hegel-rust releases are public, so the app token (scoped to
          # hegel-go) reads them fine; gh uses GH_TOKEN for the PR commands.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          git push --force origin "$BRANCH"

          workflow_url="https://github.com/hegeldev/hegel-go/blob/main/.github/workflows/bump-hegel-rust.yml"
          release_url="https://github.com/hegeldev/hegel-rust/releases/tag/v${VERSION}"
          title="Bump pinned \`libhegel\` to \`${VERSION}\`"
          body=$(printf '%s\n' \
            "This PR bumps our pinned \`libhegel\` version to [\`v${VERSION}\`](${release_url})." \
            "" \
            "---" \
            "" \
            "*This PR was automatically generated by [bump-hegel-rust.yml](${workflow_url}).*")

          # Reuse the open PR for this branch if there is one; otherwise create it.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --title "$title" --body "$body"
          fi

      # Older bump PRs are now superseded by this one. Close the ones that
      # carry only bot commits; a PR someone (or an alignment agent) pushed
      # work to is left open with a note instead — closing must never bury
      # manual work. Runs after the new PR exists, and best-effort: a hiccup
      # here must not fail the bump itself.
      - name: Supersede older bump PRs
        if: steps.bump.outputs.bumped == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          new_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          gh pr list --state open --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' |
          while IFS=$'\t' read -r pr head; do
            [ "$head" = "$BRANCH" ] && continue
            # Match the legacy fixed branch name and the per-version branches.
            case "$head" in
              ci/bump-hegel-rust | ci/bump-hegel-rust-*) ;;
              *) continue ;;
            esac
            # Authors other than the bot on the PR's commits? (GraphQL reports
            # the bot's login without the [bot] suffix; check both spellings.)
            # Bot commits can carry an empty-string login (and jq's // treats
            # "" as truthy), so fall through to the name explicitly; an author
            # with neither login nor name is treated as human — never close a
            # PR on an unknown author.
            others=$(gh pr view "$pr" --json commits \
              --jq '[.commits[].authors[] | (if (.login // "") != "" then .login elif (.name // "") != "" then .name else "unknown author" end)] | unique
                    | map(select(. != "hegel-release" and . != "hegel-release[bot]"))
                    | join(", ")')
            if [ -z "$others" ]; then
              gh pr close "$pr" --comment "Superseded by #${new_pr}, which pins libhegel ${VERSION}."
            else
              gh pr comment "$pr" --body "Superseded by #${new_pr}, which pins libhegel ${VERSION}. Leaving this PR open because it carries commits by: ${others}."
            fi
          done
